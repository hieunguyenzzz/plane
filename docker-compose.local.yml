# Local test stack for the marketing-props fork.
# Purpose: verify migration runs and API GET/PATCH on the new fields.
# Not for production. No Traefik, no TLS, no S3, no dokploy-network.
#
# Usage:
#   1. Copy/create env file at apps/api/.env.local with the variables consumed by
#      this file (see env_file below). Minimum: SECRET_KEY, POSTGRES_*, REDIS_*.
#   2. docker compose -f docker-compose.local.yml up -d migrator
#   3. docker compose -f docker-compose.local.yml up -d api
#   4. curl http://localhost:8000/api/...

services:
  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata_local:/var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - redisdata_local:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    volumes:
      - rabbitmq_data_local:/var/lib/rabbitmq

  migrator:
    image: plane-backend:v1.3.0-mkt
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env.local
    depends_on:
      - plane-db
      - plane-redis

  api:
    image: plane-backend:v1.3.0-mkt
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env.local
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - plane-db
      - plane-redis

volumes:
  pgdata_local:
  redisdata_local:
  rabbitmq_data_local:
